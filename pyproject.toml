[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "vnlaw-rag"
version = "0.1.0"
description = "Question answering over Vietnamese labor law with hybrid retrieval, LangGraph and Claude citations."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Nguyen Duc Manh" }]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "tokenizers>=0.19",
    "numpy>=1.26",
    # Retrieval. Install CPU-only PyTorch first (see README) to avoid the CUDA build.
    "sentence-transformers>=3.0",
    "langchain-core>=0.3",
    "langchain-huggingface>=0.1",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pgvector>=0.3",
    # Generation
    "langgraph>=1.2",
    "google-genai>=2.33",  # Interactions API, see llm/gemini.py
    # API
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# PDF text extraction runs offline, once, at ingest time. PyMuPDF is AGPL-licensed,
# so it lives in its own extra and the serving code (API, retrieval) never imports it.
# See docs/decisions/001-corpus-source-and-pdf-extraction.md.
ingest = ["pymupdf>=1.24"]
dev = [
    "pytest>=8.0",
    "ruff==0.17.6",  # pinned: format output differs between ruff versions
    "openpyxl>=3.1",  # golden-set review workbook (eval/review.py)
]

[project.scripts]
vnlaw-rag = "vnlaw_rag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vnlaw_rag"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "network: test needs internet access (deselect with -m 'not network')",
    "integration: needs PostgreSQL + pgvector; skipped when unreachable (-m 'not integration')",
]
