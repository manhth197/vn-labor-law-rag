# Whole stack: `docker compose up -d` (db + app on http://127.0.0.1:8000).
# First start: build the index once (embeddings are cached in ./data/cache when present):
#   docker compose run --rm app python -m vnlaw_rag.cli index
# Host port 5442 avoids clashing with other local Postgres instances.
name: vnlaw-rag

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vnlaw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vnlaw}
      POSTGRES_DB: ${POSTGRES_DB:-vnlaw}
    ports:
      - "127.0.0.1:5442:5432" # bound to localhost only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env # GEMINI_API_KEY and overrides; optional
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vnlaw}:${POSTGRES_PASSWORD:-vnlaw}@db:5432/${POSTGRES_DB:-vnlaw}
      DATA_DIR: /app/data
      HF_HOME: /models/hf
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - hf-cache:/models/hf # bge-m3 weights, downloaded once
      - ./data/cache:/app/data/cache # chunk embeddings: re-indexing is fast
    mem_limit: 4g # bge-m3 needs 2-3 GB

volumes:
  pgdata:
  hf-cache:
