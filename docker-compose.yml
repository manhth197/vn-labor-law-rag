# Local development stack. M2: database only; the app service is added in M5.
# Host port 5442 avoids clashing with other local Postgres instances.
name: vnlaw-rag

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vnlaw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vnlaw}
      POSTGRES_DB: ${POSTGRES_DB:-vnlaw}
    ports:
      - "127.0.0.1:5442:5432" # bound to localhost only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
