name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: lint and tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11"]

    # Real PostgreSQL + pgvector for the integration tests (tests/test_store_integration.py).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vnlaw
          POSTGRES_PASSWORD: vnlaw
          POSTGRES_DB: vnlaw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vnlaw -d vnlaw"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      # The tests never call the Gemini API (fake LLM) and never load bge-m3 (fake embeddings).
      TEST_DATABASE_URL: postgresql://vnlaw:vnlaw@localhost:5432/vnlaw_test
      REQUIRE_INTEGRATION: "1" # fail instead of skipping when the service is missing
      DATABASE_URL: postgresql://vnlaw:vnlaw@localhost:5432/vnlaw

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (CPU-only PyTorch first, to avoid the CUDA build)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,mcp]"

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Pytest
        run: pytest -q
